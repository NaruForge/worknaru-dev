<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Worknaru 전용 Daemon의 연결 상태를 확인합니다.">
    <title>연결 확인 · Worknaru</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="brand">WORKNARU <span>개발 환경</span></p>
        <h1>연결 확인</h1>
        <p class="intro">전용 Daemon의 현재 상태를 확인합니다.</p>
      </header>
      <section class="panel" aria-label="Daemon 상태">
        <div id="result" class="result" role="status" aria-live="polite" aria-atomic="true" data-phase="idle">
          <h2 id="result-title">설정 불러오는 중</h2>
          <p id="result-description">접속 정보를 준비하고 있습니다.</p>
        </div>
        <dl>
          <div><dt>접속 주소</dt><dd id="endpoint">—</dd></div>
          <div><dt>서버 ID</dt><dd id="server-id">—</dd></div>
          <div><dt>Paseo 버전</dt><dd id="server-version">—</dd></div>
          <div><dt>확인 시각</dt><dd id="checked-at">—</dd></div>
        </dl>
        <button id="check-status" type="button" disabled>상태 확인</button>
      </section>
      <noscript>상태를 확인하려면 브라우저에서 JavaScript를 사용해야 합니다.</noscript>
    </main>
  </body>
</html>
