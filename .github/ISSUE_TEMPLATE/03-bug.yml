name: 버그 신고
description: 기대 동작과 다르게 나타나는 문제와 재현 정보를 기록합니다.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        확인된 사실을 적고 아직 확인하지 못한 정보는 미확인으로 표시해 주세요.
        진행 상태는 Project의 Status에서 관리합니다. 로그의 자격증명과 비공개 자료는 제거해 주세요.
  - type: textarea
    id: context
    attributes:
      label: 문제와 배경
      description: 어떤 상황에서 문제가 발생했고 어떤 영향을 받았나요?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
      description: 문제가 해결되면 어떤 사용자 결과가 가능해야 하나요?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 확인한 OS, 앱·패키지 버전, 실행 방식 등 재현에 필요한 환경을 적어 주세요. 모르면 미확인으로 표시합니다.
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 문제를 다시 관찰할 수 있는 단계나 조건을 적어 주세요. 아직 재현하지 못했다면 그 사실을 표시합니다.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 같은 조건에서 원래 어떻게 동작해야 하나요?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 관찰한 결과와 오류를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 조사·수정 범위
      description: 확인된 영향 범위와 이번에 조사하거나 수정할 대상을 적어 주세요. 모르는 부분은 미확인으로 표시합니다.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: 제외 범위
      description: 이번 문제와 함께 처리하지 않을 것을 적어 주세요. 없으면 없음으로 표시합니다.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: 검증 가능한 완료 조건
      description: 어떤 재현 확인이나 결과로 해결 여부를 판단할 수 있나요?
    validations:
      required: true
  - type: textarea
    id: dependencies_risks
    attributes:
      label: 의존성과 위험
      description: 전제와 외부 제약을 적어 주세요. 없음과 미확인을 구분합니다. 이슈 간 선행 관계는 생성 후 Relationships에 설정합니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 관련 근거
      description: 관련 Issue, 로그, 스크린샷이나 문서의 링크를 적어 주세요. 비공개 자료는 게시하지 않습니다. 없으면 없음으로 표시합니다.
    validations:
      required: true
