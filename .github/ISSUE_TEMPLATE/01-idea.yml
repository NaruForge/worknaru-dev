name: 아이디어
description: 아직 구현이 승인되지 않은 제안이나 검토할 질문을 기록합니다.
labels: [idea, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        이 Form은 구현 승인을 뜻하지 않습니다. 짧게 작성해도 됩니다.
        현재 진행 상태는 Project의 Status에서 관리합니다. 공개 이슈에 자격증명이나 비공개 자료를 넣지 마세요.
  - type: textarea
    id: context
    attributes:
      label: 문제와 배경
      description: 어떤 상황에서 무엇이 불편하거나 해결되지 않았나요?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
      description: 제안이 유효하다면 어떤 결과를 얻어야 하나요?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 검토 범위
      description: 이번 제안에서 검토할 대상과 질문을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: 제외 범위
      description: 이번 검토에서 다루지 않을 것을 적어 주세요. 없으면 없음으로 표시합니다.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: 검증 가능한 완료 조건
      description: 어떤 조사 결과나 근거가 있으면 제안의 평가를 마칠 수 있나요? 구현 완료를 약속할 필요는 없습니다.
    validations:
      required: true
  - type: textarea
    id: dependencies_risks
    attributes:
      label: 의존성과 위험
      description: 전제와 외부 제약을 적어 주세요. 없음과 미확인을 구분합니다. 이슈 간 선행 관계는 생성 후 Relationships에 설정합니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 관련 근거
      description: 관련 Issue, 문서, 실험 결과의 링크를 적어 주세요. 없으면 없음으로 표시합니다.
    validations:
      required: true
