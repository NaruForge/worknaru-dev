name: UI quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Windows screenshot candidates for review
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ui-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: windows-2025
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Check diff and select verification scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -or !$env:BASE_SHA -or $env:BASE_SHA -match '^0+$') {
            'code=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $range = if ($env:EVENT_NAME -eq 'pull_request') { "$env:BASE_SHA...$env:HEAD_SHA" } else { "$env:BASE_SHA..$env:HEAD_SHA" }
          git diff --check $range
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Include both sides of renames; an unknown path always runs full CI.
          $files = @(git -c core.quotepath=false diff --name-only --no-renames $range)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $documentation = '^(README\.md|AGENTS\.md|docs/.+\.md|(apps|packages)/[^/]+/README\.md)$'
          $code = $files.Count -eq 0 -or @($files | Where-Object { $_ -cnotmatch $documentation }).Count -gt 0
          "code=$($code.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (!$code) { Write-Output 'General Markdown only: diff check passed. Review changed links, commands and policy in the PR.' }
  tests:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          WORKNARU_TEST_ROOT: ${{ runner.temp }}/worknaru-tests
      - name: Verify workspace RPC with a real Daemon (no Provider)
        run: node --test apps/agent-service/test/workspace.integration.mjs
        env:
          WORKNARU_TEST_ROOT: ${{ runner.temp }}/worknaru-tests
      - name: Verify Module CLI with a real Daemon (no Provider)
        run: node --test apps/agent-service/test/modules.integration.mjs
        env:
          WORKNARU_TEST_ROOT: ${{ runner.temp }}/worknaru-tests
  browser:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worknaru/web exec playwright install chromium
      - name: Record Windows screenshot environment
        run: |
          Write-Output "Runner image: $env:ImageOS $env:ImageVersion"
          [Environment]::OSVersion.VersionString
          Get-FileHash "$env:WINDIR/Fonts/segoeui*.ttf", "$env:WINDIR/Fonts/malgun*.ttf", "$env:WINDIR/Fonts/consola*.ttf" |
            Select-Object @{Name='Font'; Expression={Split-Path $_.Path -Leaf}}, Hash | ConvertTo-Json
      - run: pnpm build
      - if: github.event_name != 'workflow_dispatch' || !inputs.update_snapshots
        run: pnpm ui:verify
      - if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots
        name: Generate screenshot candidates
        run: |
          pnpm --filter @worknaru/web storybook:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @worknaru/web exec playwright test --update-snapshots=all
      - name: Verify Workspace CLI and Web with a real Daemon (no Provider)
        run: node apps/web/test/workspace-browser.mjs
        env:
          WORKNARU_TEST_ROOT: ${{ runner.temp }}/worknaru-tests
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots && success()
        with:
          name: windows-screenshot-candidates
          path: apps/web/test/browser/*.spec.ts-snapshots/*-win32.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/worknaru-tests/workspace-browser-*/result.json
            ${{ runner.temp }}/worknaru-tests/workspace-browser-*/*.png
            ${{ runner.temp }}/worknaru-tests/workspace-browser-*/failure.txt
          retention-days: 14
