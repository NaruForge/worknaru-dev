name: UI quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Windows screenshot candidates for review
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          WORKNARU_TEST_ROOT: ${{ runner.temp }}/worknaru-tests
  browser:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worknaru/web exec playwright install chromium
      - name: Record Windows screenshot environment
        run: |
          Write-Output "Runner image: $env:ImageOS $env:ImageVersion"
          [Environment]::OSVersion.VersionString
          Get-FileHash "$env:WINDIR/Fonts/segoeui*.ttf", "$env:WINDIR/Fonts/malgun*.ttf", "$env:WINDIR/Fonts/consola*.ttf" |
            Select-Object @{Name='Font'; Expression={Split-Path $_.Path -Leaf}}, Hash | ConvertTo-Json
      - run: pnpm build
      - if: github.event_name != 'workflow_dispatch' || !inputs.update_snapshots
        run: pnpm ui:verify
      - if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots
        name: Generate screenshot candidates
        run: |
          pnpm --filter @worknaru/web storybook:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @worknaru/web exec playwright test --update-snapshots=all
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots && success()
        with:
          name: windows-screenshot-candidates
          path: apps/web/test/browser/*.spec.ts-snapshots/*-win32.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
